name: win 11 + tailscale + Download.bat script

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      - name: Configure RDP
        shell: powershell
        run: |
          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Keep NLA enabled
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          # Standard RDP security
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 1 `
            -Force

          # Configure firewall
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 `
            remoteip=100.64.0.0/10

          # Restart RDP service
          Restart-Service -Name TermService -Force

          Write-Host "RDP configured successfully."

      - name: Create RDP User
        shell: powershell
        run: |
          $username = "RDP"
          $password = "MR.English2008"

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if (-not $existingUser) {

              New-LocalUser `
                -Name $username `
                -Password $securePass `
                -AccountNeverExpires `
                -PasswordNeverExpires

              Write-Host "RDP user created."

          } else {

              Set-LocalUser `
                -Name $username `
                -Password $securePass

              Write-Host "RDP user already exists. Password updated."
          }

          # Add to Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          # Keep administrator access as in your original setup
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user configured."

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installerPath -Force

          Write-Host "Tailscale installed."

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey=${{ secrets.TAILSCALE_AUTHKEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          Write-Host "Tailscale connected."

          $tsIP = $null

          for ($i = 1; $i -le 12; $i++) {

              $result = & $tailscale ip -4 2>$null

              $candidate = ($result |
                Select-Object -First 1).ToString().Trim()

              if ($candidate -match '^100\.\d+\.\d+\.\d+$') {
                  $tsIP = $candidate
                  break
              }

              Write-Host "Waiting for Tailscale IP..."
              Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale IP: $tsIP"

      - name: Verify RDP
        shell: powershell
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $service = Get-Service -Name TermService

          if ($service.Status -ne "Running") {
              Write-Error "Remote Desktop service is not running."
              exit 1
          }

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
              Write-Error "RDP is not listening on port 3389."
              exit 1
          }

          Write-Host "RDP is listening successfully."

      - name: Download and Prepare Downloads.bat
        shell: powershell
        run: |
          $rdpProfile = "C:\Users\RDP"

          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"

          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"

          $downloadPath = "$startupPath\Downloads.bat"

          # Wait for user profile
          $retries = 0

          while (-not (Test-Path $rdpProfile) -and $retries -lt 20) {

              Write-Host "Waiting for RDP profile..."

              Start-Sleep -Seconds 10

              $retries++
          }

          if (-not (Test-Path $rdpProfile)) {
              Write-Host "RDP profile not created yet."
              Write-Host "Downloads.bat will be prepared when the profile exists."
              exit 0
          }

          if (-not (Test-Path $startupPath)) {
              New-Item `
                -ItemType Directory `
                -Path $startupPath `
                -Force | Out-Null
          }

          try {

              Invoke-WebRequest `
                -Uri $downloadUrl `
                -OutFile $downloadPath `
                -UseBasicParsing

              if (-not (Test-Path $downloadPath)) {
                  Write-Error "Downloads.bat download failed."
                  exit 1
              }

              Write-Host "Downloads.bat copied successfully."

              # Execute once
              cmd.exe /c "`"$downloadPath`""

              Write-Host "Downloads.bat executed successfully."

          }
          catch {

              Write-Error "Error downloading/executing Downloads.bat: $($_.Exception.Message)"
              exit 1
          }

      - name: Display RDP Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "              RDP ACCESS"
          Write-Host "=========================================="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Port    : 3389"
          Write-Host "Username: RDP"
          Write-Host "Password: MR.English2008"
          Write-Host "=========================================="
          Write-Host ""

      - name: Maintain RDP Connection
        shell: powershell
        run: |
          while ($true) {

              $service = Get-Service `
                -Name TermService `
                -ErrorAction SilentlyContinue

              $tailscale = & `
                "$env:ProgramFiles\Tailscale\tailscale.exe" `
                ip -4 2>$null

              Write-Host "[$(Get-Date)] RDP: $($service.Status) | Tailscale IP: $tailscale"

              Start-Sleep -Seconds 300
          }
